<style>
:root{--ink:#17212b;--muted:#5b6671;--line:#ccd7df;--blue:#174e76;--pale:#eef5f9;--green:#175f47;--amber:#86520b;--paper:#fbfcfd}
html{scroll-behavior:smooth}body{max-width:1080px;margin:0 auto;padding:36px 56px 72px;background:var(--paper);color:var(--ink);font:16px/1.58 Georgia,"Times New Roman",serif}
h1,h2,h3{font-family:Arial,Helvetica,sans-serif;color:#163d59;line-height:1.18}h1{font-size:2.1rem;border-bottom:2px solid var(--blue);padding-bottom:.3em}h2{font-size:1.5rem;margin-top:2.1em;border-bottom:1px solid var(--line);padding-bottom:.2em}h3{font-size:1.15rem;margin-top:1.6em}
header{text-align:center;margin-bottom:2.5em}.subtitle{color:var(--muted)}#TOC{border:1px solid var(--line);background:white;padding:18px 24px;margin:24px 0}#TOC ul{columns:2;column-gap:32px}a{color:var(--blue)}
table{border-collapse:collapse;width:100%;font-size:.9rem;margin:1.2em 0;background:#fff}th,td{border:1px solid var(--line);padding:.48em .62em;vertical-align:top}th{background:#e8f0f5;text-align:left}
pre{overflow:auto;background:#202832;color:#eef5f9;padding:14px 16px;border-radius:5px;font:12px/1.48 "DejaVu Sans Mono",Consolas,monospace}code{font-family:"DejaVu Sans Mono",Consolas,monospace}.cell-code{border-left:5px solid var(--green)}
blockquote{border-left:4px solid var(--amber);margin:1.2em 0;padding:.2em 1em;color:#4f4a42;background:#fffaf0}.math.display{overflow-x:auto;padding:.3em 0}
@media(max-width:760px){body{padding:24px 18px}#TOC ul{columns:1}}
@media print{body{max-width:none;padding:0;background:#fff}#TOC{display:none}a{color:inherit;text-decoration:none}pre{white-space:pre-wrap}}
</style>
